version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # carte-facile declare un peer maplibre-gl ^5.0.0 et importe maplibregl
      # en export default, supprime en v6. A lever quand carte-facile publie
      # une version compatible v6 (0.9.0 est la derniere a ce jour).
      - dependency-name: maplibre-gl
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      github-actions:
        update-types:
          - minor
          - patch